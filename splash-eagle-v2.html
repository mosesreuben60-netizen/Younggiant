<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Young Giant</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --g:#00FF87;--gd:#00C853;--dk:#050C05;--s:#0A130A;--card:#0F1A0F;
  --b:#162416;--b2:#1E3A1E;--txt:#F0FFF0;--m:#4A7A4A;
  --display:'Bebas Neue',sans-serif;--body:'Outfit',sans-serif;--mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:var(--body);}

/* ── FULL SCREEN CANVAS ── */
#sky-canvas{position:fixed;inset:0;z-index:0;}

/* ── EAGLE IMAGE LAYER ── */
#eagle-layer{
  position:fixed;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
#eagle-svg{
  width:min(95vw,95vh);
  height:min(95vw,95vh);
  opacity:0;
  animation:eagleReveal 2.5s 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
  filter:drop-shadow(0 0 40px rgba(0,255,135,0.25)) drop-shadow(0 0 80px rgba(0,200,83,0.15));
  transform-origin:center;
}
@keyframes eagleReveal{
  0%{opacity:0;transform:scale(0.7);}
  60%{opacity:0.9;transform:scale(1.04);}
  100%{opacity:1;transform:scale(1);}
}

/* ── OVERLAY GRADIENT ── */
.overlay{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse at center,rgba(5,12,5,0) 20%,rgba(5,12,5,0.3) 60%,rgba(5,12,5,0.85) 100%),
    linear-gradient(to bottom,rgba(5,12,5,0.4) 0%,rgba(5,12,5,0) 30%,rgba(5,12,5,0) 60%,rgba(5,12,5,0.95) 100%);
}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;display:flex;opacity:0;pointer-events:none;transition:opacity 0.5s;z-index:10;overflow-y:auto;}
.screen.active{opacity:1;pointer-events:all;}

/* ── SPLASH SCREEN ── */
#scr-splash{flex-direction:column;justify-content:space-between;padding:0;}

.splash-top{
  padding:48px 24px 20px;
  text-align:center;
  animation:fadeDown 1s 1.8s ease forwards;
  opacity:0;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}

.splash-eyebrow{
  font-family:var(--mono);font-size:0.65rem;letter-spacing:0.35em;
  text-transform:uppercase;color:rgba(0,255,135,0.7);margin-bottom:8px;
}
.splash-logo{
  font-family:var(--display);
  font-size:clamp(4rem,22vw,9rem);
  color:#fff;
  letter-spacing:0.04em;line-height:0.85;
  text-shadow:0 0 60px rgba(0,255,135,0.4),0 4px 30px rgba(0,0,0,0.8);
}
.splash-logo span{color:var(--g);text-shadow:0 0 40px rgba(0,255,135,0.6),0 0 80px rgba(0,255,135,0.3);}

.splash-bottom{
  padding:20px 24px 52px;
  animation:fadeUp 1s 2.2s ease forwards;
  opacity:0;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.splash-tagline{
  font-size:1rem;font-weight:300;
  color:rgba(240,255,240,0.7);
  line-height:1.6;margin-bottom:28px;
  text-align:center;
  text-shadow:0 2px 10px rgba(0,0,0,0.8);
}
.splash-tagline strong{color:var(--g);font-weight:700;}

.splash-btns{display:flex;gap:12px;margin-bottom:32px;}
.btn-hero{
  flex:1;padding:15px 20px;border:none;border-radius:10px;
  font-family:var(--body);font-size:0.95rem;font-weight:700;
  cursor:pointer;transition:all 0.25s;
}
.btn-hero-primary{
  background:var(--g);color:#000;
  box-shadow:0 4px 20px rgba(0,255,135,0.4);
}
.btn-hero-primary:hover{background:var(--gd);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,255,135,0.5);}
.btn-hero-ghost{
  background:rgba(255,255,255,0.08);
  color:#fff;border:1px solid rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
}
.btn-hero-ghost:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.4);}

.splash-stats{
  display:flex;justify-content:space-around;
  border-top:1px solid rgba(255,255,255,0.08);
  padding-top:20px;
}
.sstat{text-align:center;}
.sstat-n{font-family:var(--display);font-size:1.8rem;color:var(--g);text-shadow:0 0 20px rgba(0,255,135,0.5);}
.sstat-l{font-family:var(--mono);font-size:0.58rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-top:2px;}

/* ── AUTH SCREEN ── */
#scr-auth{align-items:flex-end;justify-content:center;background:rgba(5,12,5,0.7);backdrop-filter:blur(8px);}
.auth-sheet{
  background:var(--card);border:1px solid var(--b2);
  border-radius:20px 20px 0 0;
  padding:28px 24px 40px;
  width:100%;max-width:480px;
  position:relative;overflow:hidden;
  animation:slideUp 0.4s ease;
  max-height:92vh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.auth-sheet::before{content:'';display:block;width:36px;height:3px;background:var(--b2);border-radius:99px;margin:0 auto 20px;}
.auth-sheet::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--g),transparent);}
.auth-logo{font-family:var(--display);font-size:1.5rem;color:var(--g);text-align:center;letter-spacing:0.1em;}
.auth-sub{text-align:center;font-family:var(--mono);font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--m);margin-bottom:22px;}
.auth-tabs{display:flex;background:var(--s);border:1px solid var(--b);border-radius:8px;padding:3px;margin-bottom:20px;}
.auth-tab{flex:1;padding:9px;border:none;border-radius:6px;background:transparent;color:var(--m);font-family:var(--body);font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.2s;color:var(--txt);}
.auth-tab.active{background:var(--g);color:#000;}
.field{margin-bottom:13px;}
.field label{display:block;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--m);margin-bottom:5px;}
.field input{width:100%;background:var(--s);border:1px solid var(--b2);border-radius:8px;padding:11px 14px;color:var(--txt);font-family:var(--body);font-size:0.88rem;outline:none;transition:border-color 0.2s;}
.field input:focus{border-color:var(--g);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-auth{width:100%;padding:13px;border:none;border-radius:8px;background:var(--g);color:#000;font-family:var(--body);font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.2s;}
.btn-auth:hover{background:var(--gd);}
.btn-auth:disabled{opacity:0.4;cursor:not-allowed;}
.auth-msg{margin-top:10px;padding:10px 13px;border-radius:8px;font-size:0.78rem;display:none;}
.auth-msg.show{display:block;}
.auth-msg.error{background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.25);color:#ff8a8a;}
.auth-msg.success{background:rgba(0,255,135,0.08);border:1px solid rgba(0,255,135,0.2);color:var(--g);}
.pwd-bars{display:flex;gap:3px;margin-top:5px;}
.pwd-bar{height:3px;flex:1;border-radius:99px;background:var(--b2);transition:background 0.3s;}
.back-btn{text-align:center;margin-top:12px;}
.back-btn button{background:none;border:none;color:var(--m);font-family:var(--body);font-size:0.78rem;cursor:pointer;}
.spin-sm{width:15px;height:15px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin 0.6s linear infinite;display:none;}
.spin-sm.show{display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:380px){.frow{grid-template-columns:1fr;}}
</style>
</head>

<script>
// ═══════════════════════════════════════
// SKY + SMALL BIRDS ANIMATION
// ═══════════════════════════════════════
const canvas = document.getElementById('sky-canvas');
const ctx = canvas.getContext('2d');
let W, H, birds = [], clouds = [], stars = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initScene(); });

// Sky gradient
function drawSky() {
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#010A01');
  grd.addColorStop(0.25, '#021402');
  grd.addColorStop(0.55, '#031C03');
  grd.addColorStop(0.8, '#051205');
  grd.addColorStop(1, '#050C05');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
}

// Stars
class Star {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H * 0.6;
    this.r = 0.3 + Math.random() * 1.2;
    this.alpha = 0.1 + Math.random() * 0.5;
    this.twinkle = Math.random() * Math.PI * 2;
    this.twinkleSpeed = 0.02 + Math.random() * 0.03;
  }
  update() { this.twinkle += this.twinkleSpeed; }
  draw() {
    const a = this.alpha * (0.7 + 0.3 * Math.sin(this.twinkle));
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#00FF87';
    ctx.shadowColor = '#00FF87';
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Small birds
class SmallBird {
  constructor(delay) {
    this.reset();
    this.x = -50 - Math.random() * 300;
    this.age = -(delay || 0);
  }
  reset() {
    this.x = -80;
    this.y = H * (0.05 + Math.random() * 0.55);
    this.speed = 0.6 + Math.random() * 1.8;
    this.scale = 0.3 + Math.random() * 0.9;
    this.wingPhase = Math.random() * Math.PI * 2;
    this.wingSpeed = 0.08 + Math.random() * 0.06;
    this.alpha = 0;
    this.vy = (Math.random() - 0.5) * 0.15;
    this.age = 0;
  }
  update() {
    this.age++;
    if (this.age < 0) return;
    this.wingPhase += this.wingSpeed;
    this.x += this.speed;
    this.y += this.vy + Math.sin(this.age * 0.02) * 0.2;
    this.alpha = Math.min(this.alpha + 0.03, 0.55 + this.scale * 0.25);
    if (this.x > W + 100) this.reset();
  }
  draw() {
    if (this.age < 0 || this.alpha < 0.01) return;
    const s = this.scale * 5;
    const wf = Math.sin(this.wingPhase) * s * 1.8;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = this.alpha;
    ctx.strokeStyle = '#00FF87';
    ctx.lineWidth = 0.8 + this.scale * 0.5;
    ctx.lineCap = 'round';
    // Simple bird silhouette - two wing arcs (M shape)
    ctx.beginPath();
    ctx.moveTo(-s * 2.5, wf * 0.3);
    ctx.quadraticCurveTo(-s * 1.2, -wf, 0, wf * 0.1);
    ctx.quadraticCurveTo(s * 1.2, -wf, s * 2.5, wf * 0.3);
    ctx.stroke();
    // Tiny body dot
    ctx.fillStyle = '#00FF87';
    ctx.beginPath();
    ctx.arc(0, 0, this.scale * 0.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Clouds - subtle green-tinted mist
class Cloud {
  constructor(x, y, w, h, alpha) {
    this.x = x || Math.random() * W;
    this.y = y || H * (0.1 + Math.random() * 0.5);
    this.w = w || 80 + Math.random() * 160;
    this.h = h || 20 + Math.random() * 40;
    this.alpha = alpha || 0.02 + Math.random() * 0.05;
    this.speed = 0.08 + Math.random() * 0.12;
  }
  update() {
    this.x += this.speed;
    if (this.x > W + this.w) this.x = -this.w;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.w * 0.6);
    grd.addColorStop(0, 'rgba(0,255,135,0.4)');
    grd.addColorStop(1, 'rgba(0,255,135,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.w * 0.6, this.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function initScene() {
  stars = Array.from({length: 60}, () => new Star());
  birds = [];
  for (let i = 0; i < 22; i++) birds.push(new SmallBird(i * 45));
  clouds = [
    new Cloud(W*0.1, H*0.15, 200, 50, 0.04),
    new Cloud(W*0.4, H*0.25, 160, 35, 0.03),
    new Cloud(W*0.7, H*0.12, 220, 55, 0.035),
    new Cloud(W*0.85, H*0.35, 140, 30, 0.025),
    new Cloud(W*0.25, H*0.42, 180, 40, 0.03),
    new Cloud(W*0.6, H*0.48, 150, 35, 0.025),
  ];
}
initScene();

let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  frame++;
  drawSky();
  stars.forEach(s => { s.update(); s.draw(); });
  clouds.forEach(c => { c.update(); c.draw(); });
  birds.forEach(b => { b.update(); b.draw(); });
}
animate();

// AUTH LOGIC
// ═══════════════════════════════════════
const API_URL = 'https://younggiant-backend-production.up.railway.app';

function showScreen(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('scr-' + n).classList.add('active');
}
function goAuth(tab) { showScreen('auth'); switchTab(tab); }
function goBack() { showScreen('splash'); }
function switchTab(t) {
  document.getElementById('form-signup').style.display = t==='signup'?'block':'none';
  document.getElementById('form-login').style.display = t==='login'?'block':'none';
  document.getElementById('tab-su').classList.toggle('active', t==='signup');
  document.getElementById('tab-li').classList.toggle('active', t==='login');
  document.getElementById('auth-msg').className = 'auth-msg';
}

async function handleSignup() {
  const fname = document.getElementById('su-fname').value.trim();
  const lname = document.getElementById('su-lname').value.trim();
  const phone = document.getElementById('su-phone').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pwd = document.getElementById('su-pwd').value;
  if (!fname||!email||!pwd) return showMsg('Please fill in all required fields.','error');
  if (pwd.length<8) return showMsg('Password must be at least 8 characters.','error');
  setLoad('su',true);
  try {
    const res = await fetch(`${API_URL}/api/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:`${fname} ${lname}`.trim(),email,phone,password:pwd})});
    const data = await res.json(); setLoad('su',false);
    if (!res.ok){showMsg(data.error||'Registration failed.','error');return;}
    localStorage.setItem('yg_token',data.token);
    localStorage.setItem('yg_user',JSON.stringify(data.user));
    showMsg('✅ Account created! Redirecting...','success');
    setTimeout(()=>{ window.location.href='app.html'; },1200);
  } catch { setLoad('su',false); showMsg('Network error. Try again.','error'); }
}

async function handleLogin() {
  const email = document.getElementById('li-email').value.trim();
  const pwd = document.getElementById('li-pwd').value;
  if (!email||!pwd) return showMsg('Enter email and password.','error');
  setLoad('li',true);
  try {
    const res = await fetch(`${API_URL}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
    const data = await res.json(); setLoad('li',false);
    if (!res.ok){showMsg('Incorrect email or password.','error');return;}
    localStorage.setItem('yg_token',data.token);
    localStorage.setItem('yg_user',JSON.stringify(data.user));
    showMsg('✅ Signed in! Redirecting...','success');
    setTimeout(()=>{ window.location.href='app.html'; },1000);
  } catch { setLoad('li',false); showMsg('Network error.','error'); }
}

function showMsg(m,t){const el=document.getElementById('auth-msg');el.textContent=m;el.className='auth-msg show '+t;}
function setLoad(f,l){document.getElementById('btn-'+f).disabled=l;document.getElementById('sp-'+f).classList.toggle('show',l);}
function checkPwd(p){let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;const c=['','#ff4444','#ffb300','#00b894','#00FF87'];for(let i=1;i<=4;i++)document.getElementById('pb'+i).style.background=i<=s?c[s]:'var(--b2)';}

// Auto-login
window.addEventListener('DOMContentLoaded',()=>{
  const t=localStorage.getItem('yg_token');
  if(t){ try{ window.location.href='app.html'; }catch{} }
});
